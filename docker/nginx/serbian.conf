# Mirror of docs/nginx.conf.example, scoped to the docker-compose overlay's
# internal network. Used by `make docker-up WITH_NGINX=1` to verify the
# subpath / reverse-proxy plumbing locally.

server {
    listen 80 default_server;
    server_name _;
    # Plain redirect to the HTTPS variant. The :8443 port stays in the URL
    # because we're using a non-standard HTTPS port in this dev overlay.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 32m;

    # Bare /serbian → /serbian/ so relative URLs resolve.
    location = /serbian {
        return 301 /serbian/;
    }

    location /serbian/ {
        proxy_pass http://app:8089/;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Prefix /serbian;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
