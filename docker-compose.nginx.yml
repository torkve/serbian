# Overlay that puts a local nginx in front of the app at /serbian/, so the
# whole production setup (subpath + reverse proxy + X-Forwarded-Prefix +
# audio-size limit) can be smoke-tested without leaving the dev machine.
#
# Usage:
#   make nginx-cert                       # one-time: generate a self-signed cert
#   make docker-build
#   make docker-up WITH_NGINX=1           # app + whisper + nginx in front
#   make docker-down WITH_NGINX=1
#
# Open: https://localhost:8443/serbian/
# (Self-signed cert — accept the browser warning the first time. For an
#  iPhone test, install the cert as trusted; for desktop browsers, click
#  past the warning.)

services:
  app:
    # Stop publishing the app port directly when nginx is in front; the app
    # is only reachable through nginx on this overlay.
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/serbian.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - serbian
